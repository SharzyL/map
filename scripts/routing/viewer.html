<!doctype html>
<!-- Proof-of-concept path viewer: python3 -m http.server -d routing, then open
     http://localhost:8000/viewer.html. Lists out/index.json's GeoJSON files. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Train path POC</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }
      #panel {
        position: absolute;
        top: 8px;
        left: 50px;
        z-index: 1000;
        background: #fff;
        padding: 6px 8px;
        font: 13px sans-serif;
        border-radius: 4px;
        box-shadow: 0 1px 4px #0004;
      }
      #panel select {
        max-width: 340px;
      }
      .key span {
        display: inline-block;
        width: 18px;
        height: 4px;
        margin: 0 4px 2px 8px;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <select id="pick"></select>
      <label><input type="checkbox" id="compare" checked /> overlay the other method</label>
      <div class="key">
        <span style="background: #1a9641"></span>line/route <span style="background: #2b83ba"></span>graph
        <span style="background: #d7191c"></span>straight <span style="background: #aaa"></span>other method
      </div>
    </div>
    <div id="map"></div>
    <script>
      const map = L.map('map').setView([35.68, 139.76], 6);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors',
      }).addTo(map);
      L.tileLayer('https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png', {
        maxZoom: 19,
        opacity: 0.5,
        attribution: 'OpenRailwayMap',
      }).addTo(map);
      const colors = { line: '#1a9641', graph: '#2b83ba', straight: '#d7191c' };
      let layers = [];

      function draw(data, other) {
        return L.geoJSON(data, {
          style: (f) => ({
            color: other ? '#888' : colors[f.properties.method] || '#000',
            weight: other ? 7 : 4,
            opacity: other ? 0.45 : 0.9,
            dashArray: f.properties.method === 'straight' ? '6 6' : null,
          }),
          pointToLayer: (f, ll) =>
            L.circleMarker(ll, { radius: other ? 0 : 5, color: '#000', weight: 1, fillColor: '#fff', fillOpacity: 1 }),
          onEachFeature: (f, layer) => {
            const p = f.properties;
            layer.bindTooltip(
              p.stop !== undefined
                ? `${p.stop}: ${p.name}`
                : `${p.from} → ${p.to}<br>${p.method}, ${p.length_km} km` +
                    (p.expected_km ? ` (timetable ${p.expected_km} km)` : '') +
                    (p.note ? `<br>${p.note}` : ''),
            );
          },
        });
      }

      async function show(name) {
        layers.forEach((l) => map.removeLayer(l));
        layers = [];
        const main = await (await fetch(`out/${name}`)).json();
        const otherName = name.replace(/-(heuristic|chain)\./, '-baseline.');
        if (document.getElementById('compare').checked && otherName !== name) {
          const res = await fetch(`out/${otherName}`);
          if (res.ok) layers.push(draw(await res.json(), true).addTo(map));
        }
        const layer = draw(main, false).addTo(map);
        layers.push(layer);
        map.fitBounds(layer.getBounds(), { padding: [20, 20] });
      }

      (async () => {
        const all = await (await fetch('out/index.json')).json();
        // Baselines are overlaid on their main file; list them only when alone
        const files = all.filter(
          (f) =>
            !f.includes('-baseline.') ||
            !all.some((g) => g === f.replace('-baseline.', '-chain.') || g === f.replace('-baseline.', '-heuristic.')),
        );
        const pick = document.getElementById('pick');
        for (const f of files) pick.add(new Option(f.replace(/\.geojson$/, ''), f));
        pick.onchange = () => show(pick.value);
        document.getElementById('compare').onchange = () => show(pick.value);
        if (files.length) show(files[0]);
      })();
    </script>
  </body>
</html>
