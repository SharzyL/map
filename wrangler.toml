#:schema node_modules/wrangler/config-schema.json
name = "map"
main = "src/worker.ts"
compatibility_date = "2025-09-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [{ pattern = "map.shz.al", custom_domain = true }]

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"

[[r2_buckets]]
binding = "ORM_BUCKET"
bucket_name = "orm"
remote = true
