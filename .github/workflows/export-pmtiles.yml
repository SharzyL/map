name: Export PMTiles

on:
  workflow_dispatch:
    inputs:
      max_zoom:
        description: 'Maximum zoom level (0-17)'
        required: false
        default: '15'
      bbox:
        description: 'Bounding box filter (minlon,minlat,maxlon,maxlat). Empty = global'
        required: false
        default: ''
      layers:
        description: 'Layer set to export: "standard" (standard-only, smaller) or "all" (all styles)'
        required: false
        default: 'standard'
        type: choice
        options:
          - all
          - standard
      upstream_repo:
        description: 'Upstream repo owner for DB image (e.g. "hiddewie")'
        required: false
        default: 'hiddewie'
      line_relations_pbf:
        description: 'OSM .pbf to read route=railway line relations from ("none" skips them)'
        required: false
        default: 'https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf'

jobs:
  export:
    name: Export PMTiles (tippecanoe)
    runs-on: ubuntu-24.04
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune -af
          df -h /

      # The import database has no route=railway relations, so they come from
      # the planet file. It is streamed through osmium without being stored
      # (~95 GB, more than the runner's disk); -R keeps only the relations, a
      # few MB. The weekly planet is then brought up to date with hourly diffs,
      # since the database is rebuilt nightly and ways added to a line since
      # the planet would otherwise miss it. This runs in the background while
      # the database starts.
      - name: Start line relation download
        env:
          LINE_RELATIONS_PBF: ${{ github.event.inputs.line_relations_pbf || 'https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf' }}
        run: |
          mkdir -p line-relations
          if [ "${LINE_RELATIONS_PBF}" = "none" ]; then
            touch line-relations/skipped
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          osmium --version | head -1
          nohup bash -c '
            set -o pipefail
            start=$(date +%s)
            if curl -sSfL "${LINE_RELATIONS_PBF}" \
                | osmium tags-filter -F pbf - r/route=railway -R -O -o line-relations/planet.osm.pbf \
              && ./scripts/tiles/update-line-relations.sh line-relations/planet.osm.pbf line-relations/lines.osm.pbf \
              && osmium cat line-relations/lines.osm.pbf -f opl,add_metadata=false -O -o line-relations/lines.opl; then
              echo "Line relations ready after $(( $(date +%s) - start ))s"
              touch line-relations/done
            else
              touch line-relations/failed
            fi
          ' > line-relations/log 2>&1 &

      - name: Pull upstream DB image
        run: |
          OWNER="${{ github.event.inputs.upstream_repo || 'hiddewie' }}"
          echo "Pulling ghcr.io/${OWNER}/openrailwaymap-import-db:latest"
          docker pull "ghcr.io/${OWNER}/openrailwaymap-import-db:latest"

      - name: Start database from upstream image
        run: |
          OWNER="${{ github.event.inputs.upstream_repo || 'hiddewie' }}"
          docker run -d \
            --name orm-db \
            -p 5432:5432 \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e PGDATA=/data/postgresql \
            --shm-size=2g \
            "ghcr.io/${OWNER}/openrailwaymap-import-db:latest"

          echo "Waiting for database to be ready..."
          for i in $(seq 1 120); do
            if docker exec orm-db psql -U postgres -d gis -c "SELECT 1" >/dev/null 2>&1; then
              echo "Database ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Verify data exists
          echo "Tables:"
          docker exec orm-db psql -U postgres -d gis -c "\dt public.*" | head -40
          echo ""
          echo "Row counts:"
          docker exec orm-db psql -U postgres -d gis -c "
            SELECT 'railway_line' as tbl, count(*) FROM railway_line
            UNION ALL SELECT 'stations', count(*) FROM stations
            UNION ALL SELECT 'signals', count(*) FROM signals
            UNION ALL SELECT 'pois', count(*) FROM pois
          "

      - name: Install GDAL (ogr2ogr)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          ogr2ogr --version

      - name: Install tippecanoe
        run: |
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe
          make -j$(nproc)
          sudo make install
          tippecanoe --version

      - name: Install pmtiles CLI
        run: |
          wget -q https://github.com/protomaps/go-pmtiles/releases/download/v1.22.3/go-pmtiles_1.22.3_Linux_x86_64.tar.gz
          tar xzf go-pmtiles_1.22.3_Linux_x86_64.tar.gz
          sudo mv pmtiles /usr/local/bin/
          pmtiles version

      - name: Wait for line relations
        timeout-minutes: 120
        run: |
          until [ -e line-relations/done ] || [ -e line-relations/failed ] || [ -e line-relations/skipped ]; do
            sleep 30
          done
          cat line-relations/log 2>/dev/null || true
          ls -lh line-relations
          [ ! -e line-relations/failed ]

      - name: Export layers and generate PMTiles
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/gis
          OUTPUT_DIR: ./output
          MAX_ZOOM: ${{ github.event.inputs.max_zoom || '15' }}
          LAYERS: ${{ github.event.inputs.layers || 'standard' }}
          BBOX: ${{ github.event.inputs.bbox || '' }}
          CONCURRENCY: '4'
        run: |
          if [ -e line-relations/done ]; then
            export LINE_RELATIONS_OPL=./line-relations/lines.opl
          fi
          ./scripts/tiles/export-tippecanoe.sh

      - name: Show output info
        run: |
          echo "=== FlatGeobuf files ==="
          ls -lhS output/fgb/ || true
          echo ""
          echo "=== PMTiles ==="
          ls -lh output/openrailwaymap.pmtiles
          pmtiles show output/openrailwaymap.pmtiles

      - name: Upload to Cloudflare R2
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BBOX: ${{ github.event.inputs.bbox || '' }}
        run: |
          pip install awscli
          if [ -n "${BBOX}" ]; then
            # Test run with a bbox filter: never overwrite the production archive.
            TARGET="s3://orm/openrailwaymap-test-${GITHUB_RUN_ID}.pmtiles"
            echo "NOTE: bbox test run, uploading to ${TARGET} (production untouched)"
          else
            TARGET="s3://orm/openrailwaymap.pmtiles"
          fi
          aws s3 cp output/openrailwaymap.pmtiles "${TARGET}" \
            --endpoint-url "$R2_ENDPOINT" \
            --checksum-algorithm SHA256 \
            --no-progress
          echo "Upload complete. Verifying..."
          aws s3 ls "${TARGET}" \
            --endpoint-url "$R2_ENDPOINT"
