name: Test

# On pull requests, and from the Build workflow before it builds or deploys.
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm fmt:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # The data scripts (scripts/*/test_*.py) and the build runner
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install -q -r scripts/requirements.txt

      - run: ./scripts/test-python.sh

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # Traces, videos and screenshots of failed attempts, flaky ones included
      # (passing tests leave nothing behind).
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
