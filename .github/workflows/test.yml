name: Test

# The checks of the build (data_builder/steps.toml: formatting, the linter,
# types, unit and end-to-end tests, the data scripts' tests) on pull requests.
# Pushes to main run them in the Build workflow, where each one runs only when
# what it reads changed; here there is no state to tell, so all of them run.
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install -q -r data_builder/requirements.txt

      - run: python3 data_builder/builder.py run --checks

      # Traces, videos and screenshots of failed attempts, flaky ones included
      # (passing tests leave nothing behind).
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
