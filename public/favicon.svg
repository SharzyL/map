<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none" role="img" aria-label="Rail map logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- 在交叉处给绿色线切出透明缺口，形成“橙线在上”的立体交叉效果，不依赖背景色 -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <path d="M36 194 C136 194 120 240 220 240" stroke="#000" stroke-width="38" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- 定位针轮廓：E5 系蓝绿色 -->
  <path d="M128 176 C104 148 76 114 76 76 A52 52 0 1 1 180 76 C180 114 152 148 128 176 Z"
        stroke="#00A99D" stroke-width="24" stroke-linejoin="round"/>
  <circle cx="128" cy="76" r="17" fill="#00A99D"/>

  <!-- 山手线绿（在下） -->
  <path d="M36 240 C136 240 120 194 220 194" mask="url(#gap)"
        stroke="#80C342" stroke-width="24" stroke-linecap="round"/>

  <!-- 中央线橙（在上） -->
  <path d="M36 194 C136 194 120 240 220 240"
        stroke="#F15A22" stroke-width="24" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
