<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1030"/>
      <stop offset="1" stop-color="#24348A"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE5F5"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <clipPath id="porthole">
      <circle cx="256" cy="215" r="107.5"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- night sky -->
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- star (subtle) -->
    <path d="M420 54 C423 80 430 87 456 90 C430 93 423 100 420 126 C417 100 410 93 384 90 C410 87 417 80 420 54 Z"
          fill="#FFE9A8" opacity="0.9"/>
    <circle cx="96" cy="84" r="5" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="60" cy="170" r="4" fill="#FFFFFF" opacity="0.4"/>

    <!-- secondary line -->
    <path d="M-20 290 C80 300 180 380 256 430 C330 478 420 500 540 505" fill="none" stroke="#008A3E" stroke-width="22" stroke-linecap="round"/>
    <circle cx="127" cy="345" r="14" fill="#FFFFFF"/>
    <circle cx="381" cy="484" r="14" fill="#FFFFFF"/>

    <!-- main rail line with stations -->
    <path d="M-20 400 C100 400 150 430 256 430 C370 430 420 380 540 372"
          fill="none" stroke="#FF8A3D" stroke-width="22" stroke-linecap="round"/>
    <circle cx="123" cy="415" r="14" fill="#FFFFFF"/>
    <circle cx="396" cy="404" r="14" fill="#FFFFFF"/>
    <circle cx="256" cy="430" r="30" fill="#FFFFFF" stroke="#0A1030" stroke-width="10"/>

    <!-- pin -->
    <path d="M256 430 C200 350 126 300 126 215 A130 130 0 1 1 386 215 C386 300 312 350 256 430 Z M256 107.5 A107.5 107.5 0 1 0 256 322.5 A107.5 107.5 0 1 0 256 107.5 Z"
          fill="url(#pin)" fill-rule="evenodd"/>

    <!-- porthole scene -->
    <g clip-path="url(#porthole)">

      <!-- train, E5-style long-nose side profile (local coords: tip at x=0, rail at y=0) -->
      <g transform="translate(162 252) scale(0.43 0.56)">
        <!-- white lower body -->
        <path d="M0 -40 C8 -58 30 -70 70 -78 C130 -88 200 -94 258 -100 C305 -106 335 -124 385 -131 C430 -136 480 -136 520 -136 L720 -136 L720 0 L62 0 L62 -9 L40 -10 C14 -12 -5 -22 0 -40 Z" fill="#FFFFFF"/>
        <!-- green upper body -->
        <path d="M0 -40 C8 -58 30 -70 70 -78 C130 -88 200 -94 258 -100 C305 -106 335 -124 385 -131 C430 -136 480 -136 520 -136 L720 -136 L720 -84 L130 -60 C80 -56 30 -48 3 -34 Z" fill="#12A58C"/>
        <!-- pink stripe -->
        <path d="M130 -60 L720 -84 L720 -76 L132 -52 C100 -50 70 -47 46 -43 C70 -51 100 -57 130 -60 Z" fill="#E8508A"/>
        <!-- canopy window -->
        <path d="M258 -97 C300 -104 340 -123 396 -128 C420 -130 436 -125 430 -114 C400 -108 330 -98 258 -97 Z" fill="#0A1030"/>
        <!-- lower skirt -->
        <path d="M62 0 L720 0 L720 -14 L120 -14 L105 -9 L62 -9 Z" fill="#0A1030" opacity="0.3"/>
        <!-- headlight -->
        <ellipse cx="30" cy="-28" rx="9" ry="5" fill="#FFD34D"/>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
